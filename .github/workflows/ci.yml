name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to notice breaking changes in new Home Assistant releases.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff format --check custom_components scripts tests
      - run: uv run ruff check custom_components scripts tests
      - run: uv run mypy
      - run: uv run pytest

  # The oldest Home Assistant in hacs.json; keeps the code Python 3.12 compatible.
  test-oldest-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv venv --clear
      - run: uv pip install pytest-homeassistant-custom-component==0.13.195
      - run: .venv/bin/python -c "import homeassistant.const as c; print(c.__version__)"
      - run: .venv/bin/python -m pytest

  # uv.lock pins the HA version used above; this follows new releases.
  test-latest-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv venv --clear
      - run: uv pip install pytest-homeassistant-custom-component
      - run: .venv/bin/python -c "import homeassistant.const as c; print(c.__version__)"
      - run: .venv/bin/python -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
