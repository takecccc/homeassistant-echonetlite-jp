name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, to notice breaking changes in new Home Assistant releases.
    - cron: "0 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff format --check custom_components scripts tests
      - run: uv run ruff check custom_components scripts tests
      - run: uv run mypy
      - run: uv run pytest

  # The job above pins the oldest supported Home Assistant (uv.lock);
  # this one runs the tests against the latest release.
  test-latest-ha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv venv
      - run: uv pip install pytest-homeassistant-custom-component
      - run: .venv/bin/python -c "import homeassistant.const as c; print(c.__version__)"
      - run: .venv/bin/python -m pytest

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
